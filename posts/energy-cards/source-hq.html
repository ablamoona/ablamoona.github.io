<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:400;src:url(ibm-plex-sans-arabic-arabic-400-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(ibm-plex-sans-arabic-arabic-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(ibm-plex-sans-arabic-arabic-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:P;background:#999}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#F7E9DF;color:#1f2f27;margin-bottom:20px}
.pg{position:absolute;z-index:6;left:44px;top:40px;font-size:24px;color:#a08f80;font-weight:600;direction:ltr}

/* cover: full-bleed */
.full{position:absolute;inset:0;width:1080px;height:1350px}
.hook{position:absolute;z-index:4;top:70px;right:64px;left:64px}
.hook .k{display:inline-block;background:#244735;color:#F3ECE1;font-size:28px;font-weight:700;padding:8px 22px;border-radius:30px}
.hook .q{font-size:108px;font-weight:700;color:#244735;line-height:1.12;margin-top:18px}
.hook .q em{font-style:normal;color:#C6A15B}
.swipe{position:absolute;z-index:4;left:44px;bottom:44px;background:#244735;color:#F3ECE1;font-size:32px;font-weight:600;padding:20px 34px;border-radius:50px;box-shadow:0 16px 40px rgba(36,71,53,.35)}
.sub{position:absolute;z-index:4;right:64px;top:430px;background:rgba(255,253,249,.92);color:#244735;font-size:34px;font-weight:600;padding:14px 26px;border-radius:24px;box-shadow:0 10px 30px rgba(70,40,30,.12)}

/* card */
.card{position:absolute;left:62px;top:34px;width:956px;height:1282px;background:#FFFDF9;border-radius:46px;box-shadow:0 40px 90px rgba(70,40,30,.2);padding:20px}
.card::before{content:"";position:absolute;inset:11px;border:2.5px solid #C6A15B;border-radius:37px;pointer-events:none;z-index:3}
.hd{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 0 14px}
.ttl{font-size:66px;font-weight:700;color:#244735;line-height:1.1}
.tag{background:#244735;color:#F3ECE1;font-weight:700;font-size:26px;padding:8px 22px;border-radius:30px}
.meters{display:flex;gap:12px;margin:14px 22px 0}
.m{white-space:nowrap;background:#F7EEE6;border-radius:22px;padding:7px 16px;font-size:24px;font-weight:600;color:#244735;display:flex;align-items:center;gap:8px}
.m i{font-style:normal;letter-spacing:2px}.m i b{font-weight:400;opacity:.22}
.ph{position:relative;margin:14px 0 0;border-radius:28px;overflow:hidden;height:1068px}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center bottom}
.steps{position:absolute;top:26px;right:22px;left:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.st{background:rgba(255,253,249,.94);border-radius:24px;padding:16px 14px 16px;position:relative;text-align:center;box-shadow:0 10px 26px rgba(70,40,30,.12)}
.st .n{width:50px;height:50px;border-radius:50%;background:#C6A15B;color:#fff;font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.st p{font-size:28px;line-height:1.4;font-weight:600;color:#2b3a33}
.ex{white-space:nowrap;margin-inline-start:auto;background:#244735;color:#F3ECE1;border-radius:22px;padding:7px 18px;font-size:24px;font-weight:600;line-height:1.5}
.ex b{color:#E3C68A}

/* end */
.end .q{position:absolute;top:120px;width:100%;text-align:center;font-size:92px;font-weight:700;color:#244735;line-height:1.25}
.end .q em{font-style:normal;color:#C6A15B}
.fan{position:absolute;left:0;right:0;top:450px;height:560px}
.fan .c{position:absolute;width:250px;height:350px;background:#FFFDF9;border-radius:24px;padding:10px;box-shadow:0 24px 50px rgba(70,40,30,.2)}
.fan .c::before{content:"";position:absolute;inset:5px;border:2px solid #C6A15B;border-radius:19px}
.fan .c img{width:100%;height:262px;object-fit:cover;border-radius:16px;object-position:center 75%}
.fan .c b{display:block;text-align:center;font-size:44px;color:#C6A15B;margin-top:2px}
.end .p{position:absolute;top:1020px;width:100%;text-align:center;font-size:42px;color:#3d4d45;font-weight:600;line-height:1.6}
.end .h{position:absolute;bottom:54px;width:100%;display:flex;justify-content:center;align-items:center;gap:16px;font-size:38px;font-weight:700;color:#244735;direction:ltr}
.end .h img{width:84px;height:84px;border-radius:50%}
</style></head><body>

<div class="s cov">
 <div style="position:absolute;inset:0;background:linear-gradient(#F4DCCD,#EBCBB9)"></div><img class="full" src="h1.jpg" style="top:170px"><div class="pg">1/7</div>
 <div class="hook"><span class="k">فايدة للمعلمات</span><div class="q">طالباتج نايمات<br>بالحصة؟ <em>😴</em></div></div>
 <div class="sub">٥ بطاقات طاقة تصحّيهن في دقيقتين ⚡</div>
 <div class="swipe">اسحبي واختاري بطاقتج ←</div>
</div>

<div id="cards"></div>

<div class="s end"><div class="pg">7/7</div>
 <div class="q">أي بطاقة<br>بتلعبين فيها <em>أول؟</em></div>
 <div class="fan" id="fan"></div>
 <div class="p">اكتبي رقمها بالتعليقات 👇<br>واحفظي البوست لحصتج الجاية 🔖</div>
 <div class="h"><img src="logo.png">@abla.moona</div>
</div>

<script>
const C=[
 {t:"التمثال المفهومي",img:"h2.jpg",e:3,z:1,m:"٢",s:["صفّقي والطالبات يمشين بين الطاولات","وقّفي وقولي مفهومًا من الدرس","يتجمّدن بوضعية تعبّر عنه"],x:"«الادخار» = حصالة 🪙"},
 {t:"خط الرأي",img:"h3.jpg",e:2,z:2,m:"٤",s:["شريط على الأرض: ✓ بطرف و✗ بطرف","اقرئي عبارة من الدرس","كل طالبة توقف عند رأيها وتبرّره"],x:"«الأونلاين أوفر دايمًا»"},
 {t:"الطابور الصامت",img:"h4.jpg",e:2,z:1,m:"١",s:["وزّعي خطوات على ٥ طالبات","يترتّبن بطابور بدون ولا كلمة","٣٠ ثانية، والصف يحكم!"],x:"خطوات غسل الصحون 🍽️"},
 {t:"تبديل الكراسي",img:"h5.jpg",e:3,z:3,m:"٣",s:["كل طالبة تاخذ كلمة من الدرس","اقرئي تعريف الكلمة","صاحبتها تبدّل مكانها بسرعة"],x:"تعريف «الضمادة» 🩹"},
 {t:"زوايا الصف الأربع",img:"h6.jpg",e:2,z:2,m:"٣",s:["كل زاوية بالصف لها لون","اعرضي سؤالًا بأربع خيارات","تمشي لزاوية إجابتها"],x:"ألياف نباتية؟ 🌿"}
];
const ar=n=>"١٢٣٤٥٦٧"[n-1];
const bars=(n,ch)=>ch.repeat(n)+'<b>'+ch.repeat(3-n)+'</b>';
document.getElementById('cards').innerHTML=C.map((c,i)=>`
<div class="s"><div class="pg">${i+2}/7</div>
 <div class="card">
  <div class="hd"><div class="ttl">${c.t}</div><div class="tag">بطاقة ${ar(i+1)}</div></div>
  <div class="meters"><div class="m">طاقة <i>${bars(c.e,'⚡')}</i></div><div class="m">إزعاج <i>${bars(c.z,'🔊')}</i></div><div class="m">⏱ ${c.m} د</div><div class="ex"><b>مثال:</b> ${c.x}</div></div>
  <div class="ph"><img src="${c.img}">
   <div class="steps">${c.s.map((s,k)=>`<div class="st"><div class="n">${ar(k+1)}</div><p>${s}</p></div>`).join('')}</div>
  </div>
 </div>
</div>`).join('');
const pos=[[760,13,40,1],[590,6,10,2],[415,0,0,3],[240,-6,10,2],[70,-13,40,1]];
document.getElementById('fan').innerHTML=pos.map(([x,r,dy,z],i)=>`<div class="c" style="left:${x}px;top:${60+dy}px;transform:rotate(${r}deg);z-index:${z}"><img src="h${i+2}.jpg"><b>${ar(i+1)}</b></div>`).join('');
</script>
</body></html>
